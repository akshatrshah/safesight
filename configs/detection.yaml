# Nothing here should be hard-coded in Python, scripts read this file.

# Real fine-tuned weights, forklift + pallet, trained on the LOCO subset.
# Base pretrained yolov8n.pt is still used below, in the benchmark section,
# for the model-size latency comparison, that's a separate, deliberate use.
model_name: "runs/detect/train-2/weights/best.pt"

confidence_threshold: 0.35

target_classes:
  - forklift
  - pallet

benchmark:
  models_to_compare:
    - "yolov8n.pt"
    - "yolov8m.pt"
  num_warmup_frames: 5
  num_timed_frames: 30